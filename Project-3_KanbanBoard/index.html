<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Kanban Board</h1>
        <div class="board">
            <div class="list" id="list1">
                <h2>To Do</h2>
                <div class="card" draggable="true">To Study</div>
                <div class="card" draggable="true">To call</div>

            </div>
            <div class="list" id="list2">
                <h2>In progress</h2>
                <div class="card" draggable="true">Learn to Code</div>

            </div>
            <div class="list" id="list3">
                <h2>Done</h2>

            </div>
        </div>
        <div class="add-to-do">
            <input type="text" class="enter-to-do" placeholder="Enter New To Do">
            <button id="add-btn">Add</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
