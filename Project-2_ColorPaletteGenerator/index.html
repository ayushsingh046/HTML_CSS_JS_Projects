<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <script src="https://kit.fontawesome.com/7033c1c5ff.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Color Palette Generator</h1>
        <button id="regen-btn">
            <i class="fa-solid fa-arrows-rotate"></i>
            Regenerate
        </button>
        <div class="palette-gen">
            <div class="color-box">
                <div class="color" style="background-color: #B87BEF"></div>
                <div class="color-info">
                    <span class="color-hex">#adj87de</span>
                    <i class="fa-solid fa-clone copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #24c607"></div>
                <div class="color-info">
                    <span class="color-hex">#adj87de</span>
                    <i class="fa-solid fa-clone copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #59A18B"></div>
                <div class="color-info">
                    <span class="color-hex">#adj87de</span>
                    <i class="fa-solid fa-clone copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #A68F55"></div>
                <div class="color-info">
                    <span class="color-hex">#adj87de</span>
                    <i class="fa-solid fa-clone copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #330940"></div>
                <div class="color-info">
                    <span class="color-hex">#adj87de</span>
                    <i class="fa-solid fa-clone copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
            <div class="color-box">
                <div class="color" style="background-color: #e86a1b"></div>
                <div class="color-info">
                    <span class="color-hex">#adj87de</span>
                    <i class="fa-solid fa-clone copy-btn" title="Copy to clipboard"></i>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
